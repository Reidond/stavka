name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22.19.0"
          cache: true
          run-install: false
      - run: vp install
      - name: Bootstrap canonical formatting
        if: github.event_name == 'push'
        run: |
          vp check --fix
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json pnpm-workspace.yaml src vite.config.ts wrangler.jsonc
            git commit -m "style: apply vite-plus formatting"
            git push
            exit 1
          fi
      - run: vp check
      - run: vp test --run
      - run: vp build
      - run: vp exec wrangler deploy --dry-run --outdir dist/worker

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: warbench-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22.19.0"
          cache: true
          run-install: false
      - run: vp install
      - run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
