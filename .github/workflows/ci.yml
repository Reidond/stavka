name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "22.19.0"
          cache: true
          run-install: false
      - run: vp install
      - name: Canonicalize benchmark formatting
        if: github.event_name == 'push'
        run: |
          vp check --fix
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/benchmark.ts src/codex-controller.ts
            git commit -m "style: apply vite-plus formatting"
            git push
            exit 1
          fi
      - run: vp check
      - run: vp exec tsc --noEmit
      - run: vp test --run
      - run: vp run build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: warbench-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "22.19.0"
          cache: true
          run-install: false
      - run: vp install
      - name: Check production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAR_BENCH_ADMIN_KEY: ${{ secrets.WAR_BENCH_ADMIN_KEY }}
          WAR_BENCH_ENCRYPTION_KEY: ${{ secrets.WAR_BENCH_ENCRYPTION_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WAR_BENCH_ADMIN_KEY WAR_BENCH_ENCRYPTION_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production secret $name" >&2
              exit 1
            fi
          done
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp exec wrangler deploy
      - name: Install stable Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAR_BENCH_ADMIN_KEY: ${{ secrets.WAR_BENCH_ADMIN_KEY }}
          WAR_BENCH_ENCRYPTION_KEY: ${{ secrets.WAR_BENCH_ENCRYPTION_KEY }}
        run: |
          printf '%s' "$WAR_BENCH_ADMIN_KEY" | vp exec wrangler secret put WAR_BENCH_ADMIN_KEY
          printf '%s' "$WAR_BENCH_ENCRYPTION_KEY" | vp exec wrangler secret put WAR_BENCH_ENCRYPTION_KEY
