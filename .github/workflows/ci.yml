name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca
        with:
          node-version: "22"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Verify source, build, and deterministic tests
        run: pnpm verify
        env:
          MASKIROVKA_MODE: replay
