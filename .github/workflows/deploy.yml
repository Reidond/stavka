name: Deploy Cloudflare applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint:tailwind
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Deterministic replay eval
        run: pnpm eval -- --replay
        env:
          MASKIROVKA_MODE: replay
      - name: Local Maskirovka smoke
        run: pnpm ai:smoke
      - run: vp run --no-cache --concurrency-limit 2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
