packages:
  - "packages/*"
  - "apps/*"
  - "services/*"
  - "tools/*"

minimumReleaseAgeExclude:
  - "@cloudflare/kumo@2.9.2"

allowBuilds:
  # Transitive via @earendil-works/pi-ai; both build scripts are no-ops.
  "@google/genai": false
  "@parcel/watcher": true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  workerd: true

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vitest: 4.1.10
